[package]
name = "hawk"
version = "1.1.0"
edition = "2024"
authors = ["Keith Haviland"]
description = "Haviland Awk: a POSIX AWK interpreter in Rust (a port of pyawk)"
license = "MIT"
publish = false

# hawk deliberately uses nothing but Rust's standard library.
[dependencies]

[dev-dependencies]

[profile.release]
# Slower to build, a little faster to run; the release binary is what the
# corpus runners test.  panic = "abort" drops the unwind tables: hawk
# reports errors as values and does not unwind through a panic, and the
# release binary is smaller (about 1.1 MiB down to 970 KiB) with no change
# in the benchmark times.
lto = true
codegen-units = 1
panic = "abort"
